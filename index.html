<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ilm Daily — Prayer & Quran</title>
<style>
  :root {
    --bg: #0f2121;
    --card: #193739;
    --card2: #142c2c;
    --border: #2b4a4a;
    --gold: #C9A24B;
    --gold-dim: #a5853d;
    --text: #e8e4d8;
    --muted: #9db3ab;
    --red: #d98880;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 28px 0 8px; }
  .star { margin: 0 auto 10px; display: block; }
  .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  h1 { font-weight: 600; font-size: 26px; margin-top: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .tabs { display: flex; gap: 6px; margin: 22px 0 18px; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 14px; font-weight: 600; padding: 10px 4px; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .pname { font-size: 16px; font-weight: 600; }
  .ptime { font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .row.next { background: rgba(201,162,75,.08); border-radius: 8px; padding: 10px 10px; border-bottom: none; }
  .row.next .pname::after { content: " • next"; color: var(--gold); font-size: 12px; }
  .locbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .locbar input {
    flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .btn {
    background: var(--gold); color: #10201f; border: none; font-weight: 700;
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .searchbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .searchbar input {
    flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .item:active { background: var(--card2); }
  .surah-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .snum { color: var(--gold); font-size: 13px; min-width: 30px; }
  .sname { font-weight: 600; font-size: 15px; flex: 1; }
  .sname-en { color: var(--muted); font-size: 13px; }
  .sar { font-size: 17px; color: var(--text); }
  .back { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 14px; font-family: inherit; margin-bottom: 12px; padding: 0; }
  .ayah {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px; cursor: pointer;
  }
  .ayah .num { display: inline-block; background: var(--gold); color: #10201f; font-size: 11px; font-weight: 700; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; margin-bottom: 8px; }
  .ar { direction: rtl; font-size: 24px; line-height: 2; text-align: right; font-family: 'Traditional Arabic', 'Amiri', serif; }
  .tr { color: var(--muted); font-size: 15px; line-height: 1.6; margin-top: 10px; }
  .wbw { background: var(--card2); border-top: 1px dashed var(--border); border-radius: 0 0 10px 10px; margin: 12px -16px -16px; padding: 14px 16px; }
  .wbw-title { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .wbw-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .wbw-w { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; text-align: center; min-width: 76px; }
  .wbw-ar { direction: rtl; font-size: 20px; }
  .wbw-tl { color: var(--gold); font-size: 12px; margin-top: 3px; }
  .wbw-tr { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .wbw-pos { color: #6d837b; font-size: 10px; margin-top: 3px; }
  .hadith-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .pill { font-size: 11px; border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 20px; padding: 2px 10px; }
  .pill.green { border-color: #6d837b; color: #9fc4ab; }
  .dua-ref { color: #6d837b; font-size: 12px; margin-top: 10px; font-style: italic; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
  .loading { text-align: center; color: var(--muted); padding: 30px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; line-height: 1.7; }
  footer { text-align: center; color: #5c7268; font-size: 12px; margin-top: 34px; }
  a { color: var(--gold); }
  .sparts { display: flex; gap: 8px; margin-bottom: 14px; }
  .spart { flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 8px 4px; font-family: inherit; font-size: 12px; cursor: pointer; text-align: center; }
  .spart.active { border-color: var(--gold-dim); color: var(--gold); background: rgba(201,162,75,.08); }
  .spart .spart-ar { display: block; font-size: 15px; color: var(--text); margin-bottom: 2px; }
  .spart.active .spart-ar { color: var(--gold); }
  .story-order { color: var(--gold); font-size: 12px; min-width: 30px; }
  .story-name-ar { direction: rtl; font-size: 20px; font-family: 'Traditional Arabic', 'Amiri', serif; }
  .seclabel { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 18px 0 10px; }
  .sref { display: inline-block; background: var(--gold); color: #10201f; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-bottom: 8px; }
  .hadith-ar { direction: rtl; font-size: 21px; line-height: 2; text-align: right; font-family: 'Traditional Arabic', 'Amiri', serif; margin-top: 10px; }
  .story-nav { display: flex; gap: 8px; margin-top: 18px; }
  .story-nav .btn { flex: 1; }
  .story-desc { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.6; }
.achip{display:inline-block;border:1px solid var(--border);border-radius:14px;padding:4px 12px;font-size:13px;color:var(--muted);user-select:none}
.achip.on{border-color:var(--gold);color:var(--gold)}
.aplay{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:var(--card2);color:var(--gold);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ayah.playing{border-color:var(--gold);background:rgba(201,162,75,.07)}
.tafsir-block{border:1px solid var(--border);border-radius:8px;margin-top:10px;background:var(--card2)}
.tafsir-block summary{cursor:pointer;padding:8px 10px;color:var(--gold);font-weight:600;font-size:13px}
.tafsir-text{padding:4px 12px 10px;font-size:13.5px;line-height:1.6}
.tafsir-text p{margin:0 0 8px}

#dlSurah.saved{border-color:#6d837b;color:#9fc4ab}
.rnote{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
</style>

<body>
<div class="wrap">
  <header>
    <svg class="star" width="64" height="64" viewBox="0 0 100 100">
      <polygon points="50,2 61,35 95,35 68,56 79,90 50,70 21,90 32,56 5,35 39,35" fill="none" stroke="#C9A24B" stroke-width="1.6" />
      <polygon points="50,15 58,38 82,38 62,53 70,77 50,62 30,77 38,53 18,38 42,38" fill="none" stroke="#C9A24B" stroke-width="0.8" />
    </svg>
    <div class="eyebrow">Ilm Daily</div>
    <h1>Prayer &amp; Quran</h1>
    <div class="sub" id="hijri-line">Powered by the Ilm API</div>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="prayer">Prayer</button>
    <button class="tab" data-tab="quran">Quran</button>
    <button class="tab" data-tab="hadith">Hadith</button>
    <button class="tab" data-tab="stories">Stories</button>
    <button class="tab" data-tab="duas">Du'as</button>
  </div>
  <div id="view"></div>
  <footer>Ilm Daily · built on the Ilm API · ilm-api.vercel.app</footer>
</div>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
<script src="stories.js"></script>
<script>
const API = "https://ilm-api.vercel.app";
const DEFAULT_KEY = "ilm_41cf502bdd0b2b07650bdb302edece3c";
const getKey = () => localStorage.getItem("ilm_key") || DEFAULT_KEY;
async function api(path, needsKey = true) {
  const headers = needsKey ? { "x-api-key": getKey() } : {};
  const res = await fetch(API + path, { headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}
let loc = JSON.parse(localStorage.getItem("ilm_loc") || "null") || { lat: 5.30, lng: -2.00, name: "Tarkwa, Ghana" };
let surahsCache = JSON.parse(localStorage.getItem("ilm_surahs") || "null");
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
const PRAYER_NAMES = { fajr: "Fajr", sunrise: "Sunrise", dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha" };
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.tab);
  });
});
function render(tab) {
  const view = $("#view");
  if (tab === "prayer") renderPrayer(view);
  else if (tab === "quran") renderSurahList(view);
  else if (tab === "hadith") renderHadith(view);
  else if (tab === "duas") renderDuaCategories(view);
  else if (tab === "stories") renderStories(view);
}
async function renderPrayer(view) {
  view.innerHTML = `
    <div class="locbar">
      <input id="locname" value="${esc(loc.name)}" placeholder="Your location name" />
      <button class="btn ghost" id="gps">Use GPS</button>
    </div>
    <div id="prayer-body"><div class="loading">Loading prayer times…</div></div>
    <p class="note">Times shown in your device's local time. Default location is Tarkwa, Ghana.</p>
    <div id="alarm-body" class="card" style="margin-top:14px"></div>`;
  $("#gps").addEventListener("click", () => {
    if (!navigator.geolocation) return alert("GPS not supported on this device");
    $("#gps").textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(pos => {
      loc = { lat: +pos.coords.latitude.toFixed(4), lng: +pos.coords.longitude.toFixed(4), name: "My location" };
      localStorage.setItem("ilm_loc", JSON.stringify(loc));
      renderPrayer(view);
    }, () => { $("#gps").textContent = "Use GPS"; alert("Could not get location"); });
  });
  $("#locname").addEventListener("change", (e) => {
    loc.name = e.target.value || "My location";
    localStorage.setItem("ilm_loc", JSON.stringify(loc));
  });
  const body = $("#prayer-body");
  try {
    const today = new Date().toISOString().slice(0, 10);
    const data = await api(`/v1/prayer-times?lat=${loc.lat}&lng=${loc.lng}&date=${today}`, false);
    const times = data.times;
    const now = new Date();
    let next = null;
    for (const k of ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"]) {
      const t = new Date(times[k]);
      if (t > now && k !== "sunrise") { next = { key: k, at: t }; break; }
    }
    const rows = ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"].map(k => `
      <div class="row ${next && next.key === k ? "next" : ""}">
        <span class="pname">${PRAYER_NAMES[k]}</span>
        <span class="ptime">${fmtTime(times[k])}</span>
      </div>`).join("");
    const nextLine = next
      ? `<div class="card" style="text-align:center">
           <div style="color:var(--muted);font-size:13px">Next prayer: <b style="color:var(--gold)">${PRAYER_NAMES[next.key]}</b></div>
           <div style="font-size:32px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums" id="countdown">—</div>
         </div>`
      : `<div class="card" style="text-align:center;color:var(--muted)">Isha has passed — next prayer is tomorrow's Fajr, God willing.</div>`;
    body.innerHTML = nextLine + `<div class="card">${rows}</div>`;
    if (next) tickCountdown(next.at);
    scheduleSalatAlarms(times);
    renderAlarmCard();
  } catch (e) {
    body.innerHTML = `<div class="empty">Could not load prayer times: ${esc(e.message)}</div>`;
    renderAlarmCard();
  }
}
function tickCountdown(target) {
  const el = $("#countdown");
  if (!el) return;
  const upd = () => {
    const ms = target - new Date();
    if (ms <= 0) { render("prayer"); return; }
    const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
    el.textContent = `${h}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;
  };
  upd();
  clearInterval(window.__cd);
  window.__cd = setInterval(upd, 1000);
}
async function renderSurahList(view) {
  view.innerHTML = `<div class="searchbar"><input id="qsearch" placeholder="Search surah — name or number" /></div><div id="qlist"><div class="loading">Loading surahs…</div></div>`;
  try {
    if (!surahsCache) {
      surahsCache = await api("/v1/quran/surahs");
      localStorage.setItem("ilm_surahs", JSON.stringify(surahsCache));
    }
    const draw = (filter = "") => {
      const f = filter.toLowerCase();
      const list = surahsCache.filter(s =>
        !f || s.name_english.toLowerCase().includes(f) || s.name_transliteration.toLowerCase().includes(f) || String(s.number) === f);
      $("#qlist").innerHTML = list.length ? list.map(s => `
        <div class="item" data-n="${s.number}">
          <div class="surah-head">
            <span class="snum">${s.number}</span>
            <span class="sname">${esc(s.name_transliteration)} <span class="sname-en">· ${esc(s.name_english)} · ${s.ayah_count} ayahs</span></span>
            <span class="sar">${s.name_arabic}</span>
          </div>
        </div>`).join("") : `<div class="empty">No surah matches "${esc(filter)}"</div>`;
      $("#qlist").querySelectorAll(".item").forEach(el =>
        el.addEventListener("click", () => renderSurah(view, +el.dataset.n)));
    };
    draw();
    $("#qsearch").addEventListener("input", e => draw(e.target.value));
  } catch (e) {
    $("#qlist").innerHTML = `<div class="empty">Could not load surahs: ${esc(e.message)}</div>`;
  }
}
async function renderSurah(view, n) {
  view.innerHTML = `<button class="back" id="back">← All surahs</button><div id="sbody"><div class="loading">Loading…</div></div>`;
  $("#back").addEventListener("click", () => renderSurahList(view));
  try {
    const meta = surahsCache.find(s => s.number === n);
    const data = await api(`/v1/quran/${n}?translation=en.sahih`);
    $("#sbody").innerHTML = `
      <div class="card" style="text-align:center">
        <div class="sar" style="font-size:28px">${meta ? meta.name_arabic : ""}</div>
        <div style="color:var(--gold);font-weight:600;margin-top:6px">${meta ? esc(meta.name_english) : "Surah " + n}</div>
        <div style="color:var(--muted);font-size:13px;margin-top:2px">${meta ? esc(meta.name_transliteration) + " · " + meta.revelation_place + " · " + meta.ayah_count + " ayahs" : ""}</div>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">
          <select id="reciter" style="background:var(--card2);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:13px">
            <option value="alafasy"${localStorage.getItem("ilm_reciter") === "alafasy" || !localStorage.getItem("ilm_reciter") ? " selected" : ""}>Mishary Alafasy</option>
            <option value="husary"${localStorage.getItem("ilm_reciter") === "husary" ? " selected" : ""}>Mahmoud Al-Husary</option>
            <option value="minshawi"${localStorage.getItem("ilm_reciter") === "minshawi" ? " selected" : ""}>Al-Minshawi</option>
            <option value="islam_sobhi"${localStorage.getItem("ilm_reciter") === "islam_sobhi" ? " selected" : ""}>Islam Sobhi</option>
          </select>
          <button class="btn" id="playSurah">▶ Play surah</button>
          <button class="btn ghost" id="dlSurah">⬇ Save offline</button>
        </div>
      </div>
      ${data.ayahs.map(a => `
        <div class="ayah" data-a="${a.ayah_number}">
          <button class="aplay" title="Play this ayah" data-p="${a.ayah_number}">▶</button>
          <span class="num">${a.ayah_number}</span>
          <div class="ar">${a.text_arabic}</div>
          <div class="tr">${esc(a.translation)}</div>
        </div>`).join("")}
      <div class="rnote" id="rnote"></div>
      <p class="note">Tap any ayah for word-by-word Arabic, transliteration, grammar — and tafsir (Ibn Kathir / Maarif-ul-Quran).</p>`;
    view.querySelectorAll(".ayah").forEach(el => el.addEventListener("click", () => toggleWords(el, n, +el.dataset.a)));
    $("#reciter").addEventListener("change", e => {
      localStorage.setItem("ilm_reciter", e.target.value);
      stopQuranAudio();
      applyReciterUI(n);
    });
    $("#dlSurah").addEventListener("click", () => {
      saveSurahOffline(n, meta ? meta.ayah_count : data.ayahs.length, $("#dlSurah"));
    });
    applyReciterUI(n);
    $("#playSurah").addEventListener("click", () => {
      const btn = $("#playSurah");
      if (qAudio) { stopQuranAudio(); return; }
      playQuranFrom(n, 1, meta ? meta.ayah_count : data.ayahs.length, meta ? meta.name_transliteration : "Surah " + n);
    });
    view.querySelectorAll(".aplay").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      if (qAudio && qAudio.dataset.a === b.dataset.p) { stopQuranAudio(); return; }
      playQuranFrom(n, +b.dataset.p, meta ? meta.ayah_count : data.ayahs.length, meta ? meta.name_transliteration : "Surah " + n);
    }));
  } catch (e) {
    $("#sbody").innerHTML = `<div class="empty">Could not load surah: ${esc(e.message)}</div>`;
  }
}
async function toggleWords(el, surah, ayah) {
  const existing = el.querySelector(".wbw");
  if (existing) { existing.remove(); return; }
  el.insertAdjacentHTML("beforeend", `<div class="wbw"><div class="loading">Loading words…</div></div>`);
  try {
    const data = await api(`/v1/quran/${surah}/${ayah}/words`);
    el.querySelector(".wbw").innerHTML = `
      <div class="wbw-title">Word by word</div>
      <div class="wbw-grid">
        ${data.words.map(w => `
          <div class="wbw-w">
            <div class="wbw-ar">${w.text_arabic}</div>
            <div class="wbw-tl">${esc(w.transliteration || "")}</div>
            <div class="wbw-tr">${esc(w.translation || "")}</div>
            <div class="wbw-pos">${esc(w.part_of_speech || "")}${w.root_arabic ? " · root: " + w.root_arabic : ""}</div>
          </div>`).join("")}
      </div>
      <div class="tafsir-sec"><div class="loading">Loading tafsir…</div></div>`;
    loadTafsir(el, surah, ayah);
  } catch (e) {
    el.querySelector(".wbw").innerHTML = `<div class="empty">Could not load words: ${esc(e.message)}</div>`;
  }
}
async function loadTafsir(el, surah, ayah) {
  const target = el.querySelector(".tafsir-sec");
  if (!target || target.dataset.loaded) return;
  try {
    const data = await api(`/v1/tafsir/${surah}/${ayah}`);
    target.dataset.loaded = "1";
    if (!data.tafsir || !data.tafsir.length) {
      target.innerHTML = `<div class="wbw-title">Tafsir</div><div class="empty">No tafsir for this ayah.</div>`;
      return;
    }
    target.innerHTML = data.tafsir.map((t, i) => `
      <details class="tafsir-block" ${i === 0 ? "open" : ""}>
        <summary>Tafsir — ${esc(t.source)}</summary>
        <div class="tafsir-text">${(t.text || "").split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      </details>`).join("");
  } catch (e) {
    target.dataset.loaded = "";
    target.innerHTML = `<div class="wbw-title">Tafsir</div><div class="empty">Could not load tafsir: ${esc(e.message)}</div>`;
  }
}
function renderHadith(view) {
  view.innerHTML = `
    <div class="searchbar">
      <input id="hsearch" placeholder="Search 34,000+ hadith by keyword" />
      <button class="btn" id="hgo">Search</button>
    </div>
    <div id="hresults"><div class="empty">Search the six canonical collections by keyword.</div></div>`;
  const run = async () => {
    const q = $("#hsearch").value.trim();
    if (!q) return;
    $("#hresults").innerHTML = `<div class="loading">Searching…</div>`;
    try {
      const data = await api(`/v1/hadith/search?q=${encodeURIComponent(q)}`);
      $("#hresults").innerHTML = data.count === 0
        ? `<div class="empty">No hadith found for "${esc(q)}".</div>`
        : `<p class="note" style="text-align:left">${data.count} results for "${esc(q)}" — showing first 20</p>` +
          data.results.map(h => `
            <div class="ayah" style="cursor:default">
              <div class="hadith-meta">
                <span class="pill">${esc(h.collection)}</span>
                <span class="pill">No. ${esc(h.hadith_number)}</span>
                ${h.grade ? `<span class="pill green">${esc(h.grade)}</span>` : ""}
              </div>
              ${h.text_arabic ? `<div class="ar" style="font-size:19px;margin-bottom:8px">${h.text_arabic}</div>` : ""}
              <div class="tr" style="color:var(--text)">Narrated ${esc(h.narrator)}: ${esc(h.text_english)}</div>
            </div>`).join("");
    } catch (e) {
      $("#hresults").innerHTML = `<div class="empty">Search failed: ${esc(e.message)}</div>`;
    }
  };
  $("#hgo").addEventListener("click", run);
  $("#hsearch").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
}
async function renderDuaCategories(view) {
  view.innerHTML = `<div id="dlist"><div class="loading">Loading du'a categories…</div></div>`;
  try {
    const cats = await api("/v1/duas/categories");
    $("#dlist").innerHTML = cats.map(c => `
      <div class="item" data-slug="${c.slug}">
        <div class="surah-head"><span class="sname">${esc(c.name.trim())}</span><span class="snum">→</span></div>
      </div>`).join("");
    $("#dlist").querySelectorAll(".item").forEach(el =>
      el.addEventListener("click", () => renderDuas(view, el.dataset.slug, el.textContent.trim())));
  } catch (e) {
    $("#dlist").innerHTML = `<div class="empty">Could not load categories: ${esc(e.message)}</div>`;
  }
}
async function renderDuas(view, slug, title) {
  view.innerHTML = `<button class="back" id="back">← All du'a categories</button><div id="dbody"><div class="loading">Loading…</div></div>`;
  $("#back").addEventListener("click", () => renderDuaCategories(view));
  try {
    const duas = await api(`/v1/duas/${encodeURIComponent(slug)}`);
    $("#dbody").innerHTML = (duas || []).map(d => `
      <div class="ayah" style="cursor:default">
        <div style="font-weight:600;color:var(--gold);font-size:14px;margin-bottom:8px">${esc(d.title)}</div>
        <div class="ar" style="font-size:22px">${d.text_arabic}</div>
        ${d.transliteration ? `<div class="tr" style="color:var(--gold);font-style:italic">${esc(d.transliteration)}</div>` : ""}
        <div class="tr">${esc(d.translation)}</div>
        ${d.reference ? `<div class="dua-ref">${esc(d.reference)}</div>` : ""}
      </div>`).join("") || `<div class="empty">No du'as in this category yet.</div>`;
  } catch (e) {
    $("#dbody").innerHTML = `<div class="empty">Could not load du'as: ${esc(e.message)}</div>`;
  }
}

// ---- Stories (Qasas al-Anbiya) module, backed by QASAS in stories.js ----
let storiesPart = "beginning";
function renderStories(view) {
  const parts = QASAS.parts;
  const list = QASAS.stories.filter(s => s.part === storiesPart).sort((a, b) => a.order - b.order);
  view.innerHTML = `
    <div class="sparts">
      ${Object.entries(parts).map(([k, p]) => `
        <button class="spart ${k === storiesPart ? "active" : ""}" data-p="${k}">
          <span class="spart-ar">${p.ar}</span>${esc(p.en)}
        </button>`).join("")}
    </div>
    <div class="story-desc">${esc(parts[storiesPart].desc)}</div>
    <div id="slist" style="margin-top:12px"></div>`;
  view.querySelectorAll(".spart").forEach(b =>
    b.addEventListener("click", () => { storiesPart = b.dataset.p; renderStories(view); }));
  $("#slist").innerHTML = list.map(s => `
    <div class="item" data-id="${s.id}">
      <div class="surah-head">
        <span class="story-order">${String(s.order).padStart(2, "0")}</span>
        <span class="sname">${esc(s.nameEn)}<div class="sname-en">${esc(s.titleEn)}</div></span>
        <span class="story-name-ar">${s.nameAr}</span>
      </div>
    </div>`).join("");
  $("#slist").querySelectorAll(".item").forEach(el =>
    el.addEventListener("click", () => renderStory(view, el.dataset.id)));
}
function renderStory(view, id) {
  const s = QASAS.stories.find(x => x.id === id);
  if (!s) { renderStories(view); return; }
  const siblings = QASAS.stories.filter(x => x.part === s.part).sort((a, b) => a.order - b.order);
  const idx = siblings.findIndex(x => x.id === id);
  const prev = siblings[idx - 1], next = siblings[idx + 1];
  view.innerHTML = `
    <button class="back" id="sback">← ${esc(QASAS.parts[s.part].en)}</button>
    <div class="card" style="text-align:center">
      <div class="story-name-ar" style="font-size:34px">${s.nameAr}</div>
      <div style="color:var(--gold);font-weight:600;margin-top:6px;font-size:17px">${esc(s.nameEn)}</div>
      <div style="color:var(--text);font-size:14px;margin-top:4px">${esc(s.titleEn)}</div>
      <div style="margin-top:10px"><span class="pill">${esc(s.era)}</span></div>
    </div>
    ${(s.summary || []).map(p => `<div class="card" style="font-size:15px;line-height:1.8">${esc(p)}</div>`).join("")}
    ${s.ayat.length ? `
      <div class="seclabel">From the Quran · مِنَ الْقُرْآنِ</div>
      ${s.ayat.map(a => `
        <div class="ayah" style="cursor:default">
          <span class="sref">${a.ref}</span>
          <div class="ar">${a.ar}</div>
          <div class="tr">${esc(a.en)}</div>
        </div>`).join("")}` : ""}
    ${s.hadith.length ? `
      <div class="seclabel">From the Sunnah · مِنَ السُّنَّةِ</div>
      ${s.hadith.map(hd => `
        <div class="ayah" style="cursor:default">
          <div class="hadith-meta">
            <span class="pill">${esc(hd.src)}</span>
            ${hd.grade ? `<span class="pill green">${esc(hd.grade)}</span>` : ""}
          </div>
          <div class="tr" style="margin-top:0">${esc(hd.en)}</div>
          ${hd.ar ? `<div class="hadith-ar">${hd.ar}</div>` : ""}
        </div>`).join("")}` : ""}
    <div class="story-nav">
      <button class="btn ghost" id="sprev" ${prev ? "" : "disabled"}>← ${prev ? esc(prev.nameEn) : "—"}</button>
      <button class="btn ghost" id="snext" ${next ? "" : "disabled"}>${next ? esc(next.nameEn) : "—"} →</button>
    </div>`;
  $("#sback").addEventListener("click", () => renderStories(view));
  if (prev) $("#sprev").addEventListener("click", () => renderStory(view, prev.id));
  if (next) $("#snext").addEventListener("click", () => renderStory(view, next.id));
  window.scrollTo(0, 0);
}

render("prayer");


// ================= QURAN AUDIO (everyayah.com + mp3quran.net CDNs) =================
const RECITERS = {
  alafasy: { name: "Mishary Alafasy", dir: "Alafasy_128kbps" },
  husary: { name: "Mahmoud Al-Husary", dir: "Husary_128kbps" },
  minshawi: { name: "Al-Minshawi", dir: "Minshawy_Murattal_128kbps" },
  islam_sobhi: { name: "Islam Sobhi", fullSurah: true }
};
let qAudio = null;
const curReciter = () => localStorage.getItem("ilm_reciter") || "alafasy";
const curRecInfo = () => RECITERS[curReciter()] || RECITERS.alafasy;
const pad3 = v => String(v).padStart(3, "0");
function ayahURL(surah, ayah) {
  return `https://everyayah.com/data/${curRecInfo().dir}/${pad3(surah)}${pad3(ayah)}.mp3`;
}
function surahAudioURL(surah) {
  return `https://cdn.mp3quran.net/audio/islam-sobhi/r1/${pad3(surah)}.mp3`;
}
function surahAudioUrls(surah, totalAyahs) {
  return curRecInfo().fullSurah
    ? [surahAudioURL(surah)]
    : Array.from({ length: totalAyahs }, (_, i) => ayahURL(surah, i + 1));
}

// ---- Offline: save a surah's audio to Cache Storage (works without network after) ----
const AUDIO_CACHE = "ilm-quran-audio";
const offlineKey = surah => `${curReciter()}_${surah}`;
const offlineMap = () => JSON.parse(localStorage.getItem("ilm_offline") || "{}");
const isSavedOffline = surah => !!offlineMap()[offlineKey(surah)];
function applyReciterUI(surah) {
  const full = !!curRecInfo().fullSurah;
  document.querySelectorAll(".aplay").forEach(b => b.style.display = full ? "none" : "flex");
  const note = document.getElementById("rnote");
  if (note) note.textContent = full
    ? "Islam Sobhi recites the full surah as one audio file — ayah-by-ayah play is available with the other reciters."
    : "";
  const dl = document.getElementById("dlSurah");
  if (dl) {
    const saved = isSavedOffline(surah);
    dl.textContent = saved ? "✓ Saved offline" : "⬇ Save offline";
    dl.disabled = false;
    dl.classList.toggle("saved", saved);
  }
}
async function saveSurahOffline(surah, totalAyahs, btn) {
  if (!("caches" in window) || !navigator.onLine && !isSavedOffline(surah)) { btn.textContent = "Offline unavailable"; return; }
  const urls = surahAudioUrls(surah, totalAyahs);
  btn.disabled = true;
  let done = 0;
  try {
    const cache = await caches.open(AUDIO_CACHE);
    const queue = urls.slice();
    const worker = async () => {
      while (queue.length) {
        const u = queue.shift();
        if (!(await cache.match(u))) {
          const r = await fetch(u);
          if (r.ok) await cache.put(u, r);
        }
        done++;
        btn.textContent = `⬇ Saving ${done}/${urls.length}…`;
      }
    };
    await Promise.all(Array.from({ length: Math.min(8, urls.length) }, worker));
    const off = offlineMap();
    off[offlineKey(surah)] = true;
    localStorage.setItem("ilm_offline", JSON.stringify(off));
    btn.textContent = "✓ Saved offline";
    btn.classList.add("saved");
  } catch (e) {
    btn.textContent = "⬇ Save offline (failed — retry)";
  }
  btn.disabled = false;
}

// ---- Background / lock-screen playback (Media Session) ----
function setMediaSession(surahName) {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "Surah " + surahName,
      artist: curRecInfo().name,
      album: "Ilm Daily — Quran",
      artwork: [{ src: new URL("icon-512.png", location.href).href, sizes: "512x512", type: "image/png" }]
    });
    navigator.mediaSession.setActionHandler("play", () => qAudio && qAudio.play());
    navigator.mediaSession.setActionHandler("pause", () => qAudio && qAudio.pause());
    navigator.mediaSession.setActionHandler("stop", () => stopQuranAudio());
  } catch (e) {}
}
function wireMediaSession() {
  if (!qAudio || !("mediaSession" in navigator)) return;
  qAudio.addEventListener("play", () => { try { navigator.mediaSession.playbackState = "playing"; } catch (e) {} });
  qAudio.addEventListener("pause", () => { try { navigator.mediaSession.playbackState = "paused"; } catch (e) {} });
  qAudio.addEventListener("loadedmetadata", () => {
    try { navigator.mediaSession.setPositionState({ duration: qAudio.duration, playbackRate: qAudio.playbackRate, position: qAudio.currentTime }); } catch (e) {}
  });
}

function stopQuranAudio() {
  if (qAudio) { qAudio.pause(); delete qAudio; qAudio = null; }
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
  const b = document.getElementById("playSurah"); if (b) b.textContent = "▶ Play surah";
  if ("mediaSession" in navigator) { try { navigator.mediaSession.playbackState = "none"; } catch (e) {} }
}
function playQuranFrom(surah, startAyah, totalAyahs, surahName) {
  stopQuranAudio();
  const full = !!curRecInfo().fullSurah;
  const play = (aNo) => {
    if (aNo > totalAyahs || !document.getElementById("playSurah")) { stopQuranAudio(); return; }
    qAudio = new Audio(full ? surahAudioURL(surah) : ayahURL(surah, aNo));
    qAudio.dataset.a = full ? "full" : aNo;
    document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
    if (!full) {
      const row = document.querySelector(`.ayah[data-a="${aNo}"]`);
      if (row) { row.classList.add("playing"); row.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
    document.getElementById("playSurah").textContent = full ? "⏹ Stop surah" : `⏹ Stop (${aNo}/${totalAyahs})`;
    setMediaSession(surahName);
    wireMediaSession();
    qAudio.addEventListener("ended", () => full ? stopQuranAudio() : play(aNo + 1));
    qAudio.addEventListener("error", () => stopQuranAudio());
    qAudio.play().catch(() => stopQuranAudio());
  };
  play(full ? 1 : startAyah);
}

// ================= SALAT ALARM =================
const ALARM_KEY = "ilm_alarm";
const ADHAN_URL = "https://www.islamcan.com/audio/adhan/azan1.mp3";
let alarmCfg = JSON.parse(localStorage.getItem(ALARM_KEY) || "null") ||
  { on: false, sound: "adhan", prayers: { fajr: true, dhuhr: true, asr: true, maghrib: true, isha: true } };
let alarmTimers = [];
let adhanAudio = null;

function saveAlarm() { localStorage.setItem(ALARM_KEY, JSON.stringify(alarmCfg)); }

function renderAlarmCard() {
  const box = $("#alarm-body");
  if (!box) return;
  const pr = alarmCfg.prayers;
  const perm = typeof Notification !== "undefined" ? Notification.permission : "unsupported";
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <b style="color:var(--gold)">🔔 Salat Alarm</b>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="alarmOn" ${alarmCfg.on ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--gold)">
        <span>${alarmCfg.on ? "ON" : "OFF"}</span>
      </label>
    </div>
    <div style="margin-top:10px;font-size:13px;color:var(--muted)">Ring the adhan at each prayer time while the app is open.</div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      ${Object.keys(pr).map(k => `<label class="achip ${pr[k] ? "on" : ""}" data-k="${k}" style="cursor:pointer">${pr[k] ? "✓ " : ""}${{fajr:"Fajr",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha"}[k]}</label>`).join("")}
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="alarmSound" style="background:var(--card2);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:6px 8px">
        <option value="adhan" ${alarmCfg.sound === "adhan" ? "selected" : ""}>Adhan (Makkah)</option>
        <option value="chime" ${alarmCfg.sound === "chime" ? "selected" : ""}>Gentle chime</option>
      </select>
      <button class="btn ghost" id="alarmTest">Test ▶</button>
      <span id="alarmPerm" style="font-size:12px;color:var(--muted)">${perm === "granted" ? "Notifications ✓" : perm === "denied" ? "Notifications blocked" : perm === "unsupported" ? "" : "Tap ON to allow notifications"}</span>
    </div>`;
  $("#alarmOn").addEventListener("change", e => {
    alarmCfg.on = e.target.checked;
    saveAlarm();
    if (alarmCfg.on && typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission().then(() => renderAlarmCard());
    }
    renderAlarmCard();
  });
  box.querySelectorAll(".achip").forEach(chip => chip.addEventListener("click", () => {
    const k = chip.dataset.k;
    alarmCfg.prayers[k] = !alarmCfg.prayers[k];
    saveAlarm(); renderAlarmCard();
  }));
  $("#alarmSound").addEventListener("change", e => { alarmCfg.sound = e.target.value; saveAlarm(); });
  $("#alarmTest").addEventListener("click", () => ringAlarm("test"));
}

function scheduleSalatAlarms(times) {
  alarmTimers.forEach(t => clearTimeout(t));
  alarmTimers = [];
  if (!alarmCfg.on) return;
  const now = new Date();
  let scheduled = 0;
  for (const k of ["fajr", "dhuhr", "asr", "maghrib", "isha"]) {
    if (!alarmCfg.prayers[k]) continue;
    const t = new Date(times[k]);
    const ms = t - now;
    if (ms > 0 && ms < 36 * 3600 * 1000) {
      alarmTimers.push(setTimeout(() => ringAlarm(k), ms));
      scheduled++;
    }
  }
  // after Isha, wake just after midnight to reschedule for tomorrow's Fajr
  const midnight = new Date(); midnight.setHours(24, 0, 10, 0);
  const mms = midnight - now;
  if (mms > 0) alarmTimers.push(setTimeout(() => { if (alarmCfg.on) render("prayer"); }, mms));
  // keep the schedule warm if the tab was asleep (missed timers)
  clearInterval(window.__alarmChk);
  window.__alarmChk = setInterval(() => {
    if (!alarmCfg.on) return;
    for (const k of ["fajr", "dhuhr", "asr", "maghrib", "isha"]) {
      if (!alarmCfg.prayers[k]) continue;
      const t = new Date(times[k]);
      const since = now2() - t;
      if (since > 0 && since < 45000 && !window.__rang?.[k + t.getDate()]) {
        (window.__rang = window.__rang || {})[k + t.getDate()] = 1;
        ringAlarm(k);
      }
    }
  }, 30000);
  function now2() { return new Date(); }
}

let chimeCtx = null;
function playChime() {
  try {
    chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = chimeCtx;
    if (ctx.state === "suspended") ctx.resume();
    for (let rep = 0; rep < 3; rep++) {
      [880, 1174.7].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t0 = ctx.currentTime + rep * 1.1 + i * 0.02;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
        o.connect(g).connect(ctx.destination);
        o.start(t0); o.stop(t0 + 1.05);
      });
    }
    return true;
  } catch (e) { return false; }
}

function playAlarmSound() {
  if (alarmCfg.sound === "chime") { playChime(); return; }
  try {
    adhanAudio = adhanAudio || new Audio(ADHAN_URL);
    adhanAudio.volume = 1;
    adhanAudio.currentTime = 0;
    adhanAudio.play().catch(() => playChime());
  } catch (e) { playChime(); }
}

function ringAlarm(key) {
  if (key !== "test" && !alarmCfg.on) return;
  const label = key === "test" ? "Test alarm" : `It is time for ${PRAYER_NAMES[key]}`;
  playAlarmSound();
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 600]); } catch (e) {}
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification("Ilm Daily — " + label, { body: key === "test" ? "This is how the salat alarm sounds." : `${PRAYER_NAMES[key]} has begun in your area. حي على الصلاة`, icon: "/icon-192.png" }); } catch (e) {}
  }
  const banner = document.createElement("div");
  banner.id = "alarmBanner";
  banner.style.cssText = "position:fixed;inset:auto 0 0 0;z-index:999;background:#C9A24B;color:#0f2121;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;box-shadow:0 -4px 20px rgba(0,0,0,.4)";
  banner.innerHTML = `<span>🔔 ${esc(label)}${key === "test" ? "" : ` — <span dir="rtl">حي على الصلاة</span>`}</span><button style="background:#0f2121;color:#C9A24B;border:none;border-radius:8px;padding:6px 14px;cursor:pointer">Dismiss</button>`;
  banner.querySelector("button").addEventListener("click", () => banner.remove());
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 60000);
  if (key !== "test") setTimeout(() => render("prayer"), 4000);
}
