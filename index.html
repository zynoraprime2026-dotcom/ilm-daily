<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f2121" />
<title>Ilm Daily &mdash; Prayer &amp; Quran</title>
<style>
  :root {
    --bg: #0f2121;
    --card: #193739;
    --card2: #142c2c;
    --border: #2b4a4a;
    --gold: #C9A24B;
    --gold-dim: #a5853d;
    --text: #e8e4d8;
    --muted: #9db3ab;
    --red: #d98880;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 28px 0 8px; }
  .star { margin: 0 auto 10px; display: block; }
  .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  h1 { font-weight: 600; font-size: 26px; margin-top: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .tabs { display: flex; gap: 6px; margin: 22px 0 18px; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; background: none; border: none; color: var(--muted);
    font-size: 14px; font-weight: 600; padding: 10px 4px; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .pname { font-size: 16px; font-weight: 600; }
  .ptime { font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .row.next { background: rgba(201,162,75,.08); border-radius: 8px; padding: 10px 10px; border-bottom: none; }
  .row.next .pname::after { content: " • next"; color: var(--gold); font-size: 12px; }
  .locbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .locbar input {
    flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .btn {
    background: var(--gold); color: #10201f; border: none; font-weight: 700;
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold-dim); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .searchbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .searchbar input {
    flex: 1; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .item:active { background: var(--card2); }
  .surah-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .snum { color: var(--gold); font-size: 13px; min-width: 30px; }
  .sname { font-weight: 600; font-size: 15px; flex: 1; }
  .sname-en { color: var(--muted); font-size: 13px; }
  .sar { font-size: 17px; color: var(--text); }
  .back { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 14px; font-family: inherit; margin-bottom: 12px; padding: 0; }
  .ayah {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px; cursor: pointer;
  }
  .ayah:active { background: var(--card2); }
  .anum { color: var(--gold-dim); font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; }
  .ar { font-size: 22px; line-height: 2.1; text-align: right; direction: rtl; margin-bottom: 10px; }
  .tr { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .status { color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
  .status.err { color: var(--red); }
  .acount { color: var(--muted); font-size: 12px; margin-top: 2px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding-top: 24px; opacity: .7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="star" width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="15" y="15" width="18" height="18" fill="none" stroke="#C9A24B" stroke-width="2"/>
      <rect x="15" y="15" width="18" height="18" fill="none" stroke="#C9A24B" stroke-width="2" transform="rotate(45 24 24)"/>
      <circle cx="24" cy="24" r="2.5" fill="#C9A24B"/>
    </svg>
    <div class="eyebrow">Prayer &amp; Quran</div>
    <h1>Ilm Daily</h1>
    <p class="sub">Daily prayer times and the Noble Quran, wherever you are.</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-prayer" onclick="showTab('prayer')">Prayer</button>
    <button class="tab" id="tab-quran" onclick="showTab('quran')">Quran</button>
  </div>

  <div id="view-prayer">
    <div class="locbar">
      <input id="city" placeholder="City (e.g. Accra)" />
      <button class="btn" id="go" onclick="loadCity()">Get times</button>
      <button class="btn ghost" id="gps" onclick="loadGPS()">GPS</button>
    </div>
    <div class="status" id="pstatus"></div>
    <div id="pcard"></div>
  </div>

  <div id="view-quran" style="display:none">
    <div id="quran-list">
      <div class="searchbar"><input id="qsearch" placeholder="Search surah name or number&hellip;" oninput="renderSurahs()" /></div>
      <div id="surahs"></div>
    </div>
    <div id="quran-reader" style="display:none">
      <button class="back" onclick="closeSurah()">&larr; Back to surahs</button>
      <div id="reader-head"></div>
      <div id="ayahs"></div>
    </div>
  </div>

  <footer>Ilm Daily &mdash; powered by Ilm API. Verify times with your local mosque.</footer>
</div>

<script>
const API = 'https://ilm-api.vercel.app';
const KEY = 'ilm_41cf502bdd0b2b07650bdb302edece3c';
const ORD = [['fajr','Fajr'],['sunrise','Sunrise'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];

async function api(path) {
  const r = await fetch(API + path, { headers: { 'x-api-key': KEY } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function showTab(t) {
  document.getElementById('view-prayer').style.display = t === 'prayer' ? '' : 'none';
  document.getElementById('view-quran').style.display = t === 'quran' ? '' : 'none';
  document.getElementById('tab-prayer').classList.toggle('active', t === 'prayer');
  document.getElementById('tab-quran').classList.toggle('active', t === 'quran');
}

const fmt = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const pstatus = document.getElementById('pstatus');

function renderPrayer(d, label) {
  const now = new Date();
  let nextKey = null, nextAt = null;
  for (const pair of ORD) {
    const t = new Date(d.times[pair[0]]);
    if (t > now) { nextKey = pair[0]; nextAt = t; break; }
  }
  let rows = '';
  for (const pair of ORD) {
    const k = pair[0], name = pair[1];
    const cls = (k === nextKey) ? 'row next' : 'row';
    let extra = '';
    if (k === nextKey && nextAt) {
      const m = Math.round((nextAt - now) / 60000);
      extra = ' <span style="font-size:12px">in ' + Math.floor(m / 60) + 'h ' + (m % 60) + 'm</span>';
    }
    const st = (k === 'sunrise') ? ' style="color:var(--muted)"' : '';
    rows += '<div class="' + cls + '"><span class="pname"' + st + '>' + name + '</span><span class="ptime"' + st + '>' + fmt(d.times[k]) + extra + '</span></div>';
  }
  document.getElementById('pcard').innerHTML =
    '<div class="card">' + rows + '</div>' +
    '<p class="meta" style="text-align:center">' + (label || d.city) + ' &bull; ' + d.method + ' &bull; ' + d.date + '</p>';
}

async function loadPrayer(qs, label) {
  pstatus.className = 'status'; pstatus.textContent = 'Loading prayer times…';
  document.getElementById('pcard').innerHTML = '';
  try {
    const d = await api('/v1/prayer-times?' + qs);
    pstatus.textContent = '';
    renderPrayer(d, label);
  } catch (e) {
    pstatus.className = 'status err';
    pstatus.textContent = 'Could not load times: ' + e.message + '. Try GPS, or a city like Accra.';
  }
}

function loadCity() {
  const c = (document.getElementById('city').value || 'Accra').trim();
  localStorage.setItem('ilm-city', c);
  loadPrayer('city=' + encodeURIComponent(c), c);
}

function loadGPS() {
  if (!navigator.geolocation) { pstatus.className = 'status err'; pstatus.textContent = 'Location not available on this device.'; return; }
  pstatus.className = 'status'; pstatus.textContent = 'Finding your location…';
  navigator.geolocation.getCurrentPosition(
    (pos) => loadPrayer('lat=' + pos.coords.latitude + '&lng=' + pos.coords.longitude, 'Your location'),
    () => { pstatus.className = 'status err'; pstatus.textContent = 'Location permission denied.'; },
    { timeout: 10000 }
  );
}

/* ===== Quran ===== */
let SURAH_CACHE = null;

async function loadSurahs() {
  const el = document.getElementById('surahs');
  if (!SURAH_CACHE) {
    el.innerHTML = '<div class="status">Loading surah list…</div>';
    try { SURAH_CACHE = await api('/v1/quran/surahs'); }
    catch (e) { el.innerHTML = '<div class="status err">Could not load surahs: ' + e.message + '</div>'; return; }
  }
  renderSurahs();
}

function renderSurahs() {
  const q = (document.getElementById('qsearch').value || '').toLowerCase().trim();
  const list = SURAH_CACHE.filter((s) =>
    !q || s.name_transliteration.toLowerCase().includes(q) ||
    s.name_english.toLowerCase().includes(q) ||
    String(s.number) === q.replace(/^0+/, ''));
  document.getElementById('surahs').innerHTML = list.map((s) =>
    '<div class="item" onclick="openSurah(' + s.number + ')">' +
      '<div class="surah-head">' +
        '<span class="snum">' + String(s.number).padStart(3, '0') + '</span>' +
        '<span class="sname">' + s.name_transliteration + '<div class="sname-en">' + s.name_english + '</div></span>' +
        '<span class="acount">' + s.ayah_count + ' ayahs</span>' +
        '<span class="sar">' + s.name_arabic + '</span>' +
      '</div>' +
    '</div>').join('') ||
    '<div class="status">No surah found.</div>';
}

async function openSurah(n) {
  document.getElementById('quran-list').style.display = 'none';
  document.getElementById('quran-reader').style.display = '';
  const head = document.getElementById('reader-head');
  const ay = document.getElementById('ayahs');
  ay.innerHTML = '<div class="status">Loading surah…</div>';
  try {
    const d = await api('/v1/quran/' + n);
    head.innerHTML = '<div class="card"><div class="surah-head">' +
      '<span class="snum">' + String(n).padStart(3, '0') + '</span>' +
      '<span class="sname">' + d.surah.name_transliteration + '<div class="sname-en">' + d.surah.name_english + ' &bull; ' + d.surah.revelation_place + '</div></span>' +
      '<span class="sar">' + d.surah.name_arabic + '</span></div>' +
      '<p class="meta" style="margin-top:10px">' + d.surah.ayah_count + ' ayahs &bull; ' + d.translation_code + ' translation &bull; tap an ayah to copy it</p></div>';
    ay.innerHTML = d.ayahs.map((a) =>
      '<div class="ayah" onclick="copyAyah(this)">' +
        '<div class="anum">AYAH ' + a.ayah_number + '</div>' +
        '<div class="ar">' + a.text_arabic + '</div>' +
        '<div class="tr">' + a.translation + '</div>' +
      '</div>').join('');
  } catch (e) {
    ay.innerHTML = '<div class="status err">Could not load surah: ' + e.message + '</div>';
  }
}

function closeSurah() {
  document.getElementById('quran-reader').style.display = 'none';
  document.getElementById('quran-list').style.display = '';
}

function copyAyah(el) {
  const text = el.querySelector('.ar').innerText + '\n\n' + el.querySelector('.tr').innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(text);
  const badge = document.createElement('span');
  badge.style.cssText = 'color:var(--gold);font-size:12px;float:right';
  badge.textContent = 'Copied \u2713';
  el.querySelector('.anum').appendChild(badge);
  setTimeout(() => badge.remove(), 1600);
}

/* init */
document.getElementById('city').value = localStorage.getItem('ilm-city') || 'Accra';
document.getElementById('city').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadCity(); });
loadCity();
loadSurahs();
</script>
</body>
</html>
