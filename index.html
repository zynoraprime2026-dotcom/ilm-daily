<style>
/* ============ design tokens (matching the Ilm Dictionary family) ============ */
:root {
  --bg: #0b1a18; --bg2: #0e211e;
  --card: #122623; --card2: #16302b; --raise: #1a3833;
  --border: #24423b; --border2: #2f5249;
  --gold: #d9b46a; --gold-dim: #b8893c; --gold-soft: rgba(217,180,106,.14);
  --text: #f2ecdb; --fg: #f2ecdb; --muted: #92aaa2; --faint: #5f7a72;
  --red: #d96a52; --green: #5fc08e;
  --glass: rgba(11,26,24,.82);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --nav-h: 74px;
  --radius: 16px;
}
html[data-theme="light"] {
  --bg: #f2efe6; --bg2: #ece8db;
  --card: #ffffff; --card2: #faf7ee; --raise: #f5f1e4;
  --border: #ddd6c2; --border2: #cbc2a6;
  --gold: #a3741f; --gold-dim: #8a5f14; --gold-soft: rgba(163,116,31,.12);
  --text: #1c2a27; --fg: #1c2a27; --muted: #5e6f69; --faint: #8b988f;
  --red: #b8502f; --green: #2f7d54;
  --glass: rgba(242,239,230,.85);
  --shadow: 0 10px 28px rgba(60,55,30,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  background-image: radial-gradient(1200px 500px at 50% -140px, var(--gold-soft), transparent 60%);
  color: var(--text); font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh; padding-bottom: calc(var(--nav-h) + 24px);
  transition: background-color .3s, color .3s;
  font-feature-settings: 'ss01';
}
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 26px; }

/* ============ top app bar ============ */
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.appbar-in {
  max-width: 640px; margin: 0 auto; padding: 10px 14px;
  display: flex; align-items: center; gap: 11px;
}
.logomark {
  width: 42px; height: 42px; border-radius: 13px; flex: none;
  background: linear-gradient(145deg, var(--gold), var(--gold-dim));
  color: #14100a; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(184,137,60,.35);
}
.logomark svg { width: 24px; height: 24px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 16.5px; font-weight: 800; letter-spacing: .2px; line-height: 1.2; }
.brand .tag { font-size: 10.5px; color: var(--muted); letter-spacing: .4px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex: none;
  transition: transform .15s, color .2s, border-color .2s;
}
.iconbtn:active { transform: scale(.92); }
.iconbtn:hover { color: var(--gold); border-color: var(--border2); }
.iconbtn svg { width: 19px; height: 19px; }

/* ============ bottom navigation ============ */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  display: flex; justify-content: center; gap: 2px;
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab {
  background: none; border: none; cursor: pointer; font-family: inherit;
  color: var(--faint); flex: 1; max-width: 96px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px 5px; border-radius: 14px; border-bottom: none;
  transition: color .2s, background .2s, transform .15s;
}
.tab svg { width: 21px; height: 21px; }
.tab span { font-size: 10px; font-weight: 600; letter-spacing: .2px; }
.tab:active { transform: scale(.92); }
.tab.active { color: var(--gold); background: var(--gold-soft); box-shadow: 0 4px 14px color-mix(in srgb, var(--gold) 16%, transparent); }
@media (min-width: 700px) { .tabs { left: 50%; right: auto; transform: translateX(-50%); width: 640px; border-radius: 18px 18px 0 0; } }

/* ============ shared components ============ */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,.02) inset;
  transition: border-color .25s, box-shadow .25s;
}
.card:hover { border-color: var(--border2); box-shadow: 0 8px 22px rgba(0,0,0,.14); }
html[data-theme="light"] .card:hover { box-shadow: 0 8px 22px rgba(60,55,30,.10); }
.row { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.pname { font-size: 15px; font-weight: 600; }
.ptime { font-size: 17px; color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 700; }
.row.next { background: var(--gold-soft); border-radius: 12px; padding: 11px 12px; border-bottom: none; margin: 2px 0; }
.row.next .pname::after { content: " · next"; color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .5px; }
.locbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
.locbar input, .searchbar input, .hjump input, select {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 12px 14px; border-radius: 14px; font-size: 15px; font-family: inherit;
  transition: border-color .2s, box-shadow .2s;
}
.locbar input:focus, .searchbar input:focus, .hjump input:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.searchbar input { width: 100%; flex: 1; font-size: 16px; }
.searchbar { display: flex; gap: 8px; margin-bottom: 14px; }
.btn {
  background: linear-gradient(145deg, var(--gold), var(--gold-dim)); color: #14100a; border: none;
  font-weight: 700; padding: 10px 16px; border-radius: 13px; cursor: pointer; font-size: 13.5px; font-family: inherit;
  box-shadow: 0 3px 12px rgba(184,137,60,.28);
  transition: transform .15s, filter .2s;
}
.btn:active { transform: scale(.96); }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border: 1px solid var(--border2); color: var(--gold); box-shadow: none; font-weight: 600; }
.btn:disabled { opacity: .55; pointer-events: none; }
.btn:focus-visible, .iconbtn:focus-visible, .tab:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.item {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.item:active { transform: scale(.98); }
.item:hover { border-color: var(--border2); }
.surah-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.snum { color: var(--gold); font-size: 13px; min-width: 30px; font-weight: 700; }
.sname { font-weight: 600; font-size: 15px; flex: 1; }
.sname-en { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.sar { font-size: 19px; color: var(--gold); font-family: 'Amiri', serif; }
.back { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 600; margin-bottom: 12px; padding: 4px 0; }
.ayah {
  position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 12px; cursor: pointer;
  transition: border-color .2s, box-shadow .25s;
}
.ayah:hover { border-color: var(--border2); }
.ayah .num { display: inline-block; background: var(--gold); color: #14100a; font-size: 11px; font-weight: 700; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; margin-bottom: 8px; }
.ar { direction: rtl; font-size: 25px; line-height: 2.1; text-align: right; font-family: 'Amiri', serif; }
.tr { color: var(--muted); font-size: 14.5px; line-height: 1.65; margin-top: 10px; }
.wbw { background: var(--card2); border-top: 1px dashed var(--border); border-radius: 0 0 var(--radius) var(--radius); margin: 12px -18px -16px; padding: 14px 18px; }
.wbw-title { color: var(--gold); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
.wbw-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.wbw-w { border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; text-align: center; min-width: 76px; background: var(--card); }
.wbw-ar { direction: rtl; font-size: 20px; font-family: 'Amiri', serif; }
.wbw-tl { color: var(--gold); font-size: 12px; margin-top: 3px; }
.wbw-tr { color: var(--muted); font-size: 12px; margin-top: 3px; }
.wbw-pos { color: var(--faint); font-size: 10px; margin-top: 3px; }
.hadith-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pill { font-size: 11px; border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 999px; padding: 3px 11px; font-weight: 600; }
.pill.green { border-color: color-mix(in srgb, var(--green) 45%, transparent); color: var(--green); }
.dua-ref { color: var(--faint); font-size: 12px; margin-top: 10px; font-style: italic; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; line-height: 1.7; }
.hgrid-head { text-align: left; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin: 14px 2px 8px; }
#hbooks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hbook { text-align: center; padding: 16px 8px; cursor: pointer; border: 1px solid var(--border); border-radius: 16px; background: var(--card); transition: border-color .2s, transform .15s; }
.hbook:active { transform: scale(.98); }
.hbook:hover { border-color: var(--border2); }
.hb-avatar { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px; }
.hb-name { font-weight: 700; font-size: 13px; color: var(--fg); }
.hb-ar { font-size: 17px; margin-top: 3px; color: var(--gold); font-family: 'Amiri', serif; }
.hb-count { font-size: 11px; color: var(--muted); margin-top: 5px; }
.hcard .hc-en { color: var(--text); font-size: 13.5px; margin-top: 4px; line-height: 1.6; }
.hcard .hc-en b { color: var(--fg); }
.hcard .hc-ar { display: none; direction: rtl; text-align: right; font-size: 20px; line-height: 2; margin-top: 10px; font-family: 'Amiri', serif; }
.hcard.open .hc-ar { display: block; }
.hc-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hcard.open .hc-clamp { display: block; overflow: visible; }
.hpager { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 14px 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.hjump { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 10px 0 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.hjump input { width: 72px; padding: 7px 10px; font-size: 13px; }
.loading { text-align: center; color: var(--muted); padding: 30px; font-size: 14px; animation: ildpulse 1.6s infinite; }
@keyframes ildpulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
.note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; line-height: 1.7; }
footer { text-align: center; color: var(--faint); font-size: 11px; margin-top: 34px; }
a { color: var(--gold); }
.sparts { display: flex; gap: 8px; margin-bottom: 14px; }
.spart { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 12px; padding: 9px 4px; font-family: inherit; font-size: 12px; cursor: pointer; text-align: center; transition: border-color .2s, color .2s; }
.spart.active { border-color: var(--gold-dim); color: var(--gold); background: var(--gold-soft); }
.spart .spart-ar { display: block; font-size: 15px; color: var(--text); margin-bottom: 2px; font-family: 'Amiri', serif; }
.spart.active .spart-ar { color: var(--gold); }
.story-order { color: var(--gold); font-size: 12px; min-width: 30px; font-weight: 700; }
.story-name-ar { direction: rtl; font-size: 21px; font-family: 'Amiri', serif; }
.seclabel { color: var(--gold); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 18px 0 10px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.seclabel::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.sref { display: inline-block; background: var(--gold); color: #14100a; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
.hadith-ar { direction: rtl; font-size: 22px; line-height: 2; text-align: right; font-family: 'Amiri', serif; margin-top: 10px; }
.story-nav { display: flex; gap: 8px; margin-top: 18px; }
.story-nav .btn { flex: 1; }
.story-desc { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.6; }
.achip { display:inline-block; border:1px solid var(--border); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--muted); user-select:none; cursor:pointer; transition: border-color .2s, color .2s, background .2s; }
.achip.on { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
.aplay { position:absolute; top:10px; inset-inline-end:10px; width:32px; height:32px; border-radius:50%; border:1px solid var(--gold-dim); background:var(--card); color:var(--gold); font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition: transform .15s, background .2s; }
.aplay:active { transform: scale(.9); }
.ayah.playing { border-color: var(--gold); background: var(--gold-soft); }
.tafsir-block { border:1px solid var(--border); border-radius:12px; margin-top:10px; background:var(--card2); }
.tafsir-block summary { cursor:pointer; padding:9px 12px; color:var(--gold); font-weight:600; font-size:13px; }
.tafsir-text { padding:4px 14px 12px; font-size:13.5px; line-height:1.65; color: var(--muted); }
.tafsir-text p { margin:0 0 8px; color: var(--text); }
#dlSurah.saved { border-color: color-mix(in srgb, var(--green) 45%, transparent); color: var(--green); }
.rnote { color:var(--muted); font-size:12px; margin-top:6px; line-height:1.5; }
#installBar { display:none; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; padding:12px 16px; margin-bottom:14px; position: fixed; bottom: calc(var(--nav-h) + 12px); left: 12px; right: 12px; z-index: 50; box-shadow: var(--shadow); max-width: 616px; margin-left: auto; margin-right: auto; }
#installBar .ib-close { position:static; inset-inline-end:auto; width:28px; height:28px; flex:none; }
#installBar span { font-size: 12.5px; color: var(--muted); }
.eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
h1 { font-weight: 800; font-size: 26px; margin-top: 4px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

/* memorize panel */
.memrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 9px; font-size: 12px; color: var(--muted); }
.memrow input { width: 58px; padding: 6px 8px; font-size: 13px; }
.memrow select { padding: 6px 8px; font-size: 12.5px; }
.memstatus { font-size: 12px; color: var(--gold); font-weight: 700; }

/* entry animation */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#view > * { animation: fadeUp .38s cubic-bezier(.2,.7,.3,1) both; }
#view > *:nth-child(2) { animation-delay: .04s; }
#view > *:nth-child(3) { animation-delay: .08s; }
#view > *:nth-child(n+4) { animation-delay: .12s; }
@media (prefers-reduced-motion: reduce) {
  #view > *, .card, .btn, .loading { animation: none !important; transition: none !important; }
}
</style>

<script>
/* Offline layer: bundled data (duas, hadith) + on-device prayer calc */
async function bundle(path) {
  const res = await fetch("./" + path, { cache: "no-cache" });
  if (!res.ok) throw new Error("bundle missing: " + path);
  return res.json();
}
function netBadge() {
  const el = document.getElementById("net");
  if (!el) return;
  const on = navigator.onLine;
  el.textContent = on ? "\u25CF online" : "\u25CF offline mode";
  el.style.color = on ? "#7ec97e" : "#e8a94e";
}
window.addEventListener("online", netBadge);
window.addEventListener("offline", netBadge);
const HADITH_CACHE = "ilm-hadith-text";
async function hadithSaved(slug) {
  if (!("caches" in window)) return false;
  return !!(await (await caches.open(HADITH_CACHE)).match(`./hadith/${slug}.ndjson`));
}
async function saveHadithText(slug, onProgress) {
  const c = await caches.open(HADITH_CACHE);
  const r = await fetch(`./hadith/${slug}.ndjson`);
  if (!r.ok) throw new Error("download failed");
  await c.put(`./hadith/${slug}.ndjson`, r.clone());
  onProgress && onProgress(1, 1);
}
</script>

// Keyless: the server's /web/v1 gate acts on the app's behalf (origin-checked),

const API = "https://ilm-api.vercel.app/web";
async function api(path, needsKey = true) {
  const res = await fetch(API + path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");

}

// The full Quran ships inside the app (quran.js) — the sura list and every

// ---- Quran reading progress, bookmarks & sharing ----
const MARKS_KEY = "ilm_marks", LAST_KEY = "ilm_last_read", STREAK_KEY = "ilm_streak";
const quranMarks = () => JSON.parse(localStorage.getItem(MARKS_KEY) || "[]");
const saveQuranMarks = m => localStorage.setItem(MARKS_KEY, JSON.stringify(m));
function markStreak() {
  const t = new Date(); const day = t.toISOString().slice(0, 10);
  const st = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"cur":0,"best":0,"last":""}');
  if (st.last === day) return st;
  if (st.last === new Date(t.getTime() - 86400000).toISOString().slice(0, 10)) st.cur += 1; else st.cur = 1;
  st.last = day; st.best = Math.max(st.best, st.cur);
  localStorage.setItem(STREAK_KEY, JSON.stringify(st));
  return st;
}
function noteLastRead(n, meta) {
  markStreak();
  localStorage.setItem(LAST_KEY, JSON.stringify({ surah: n, name: meta ? meta.name_english : "Surah " + n, ts: Date.now() }));
}
function shareText(text) {

  const url = "https://wa.me/?text=" + encodeURIComponent(text);

}

    if (!surahsCache) {
      surahsCache = await api("/v1/quran/surahs");

    }

      const f = filter.toLowerCase();

// ---- Save the whole Quran offline (resumable, cancellable, skips saved surahs) ----
function savedSurahCount() {
  const off = offlineMap();
  return Object.keys(off).filter(k => k.startsWith(curReciter() + "_")).length;
}
let quranDl = { running: false, cancel: false };
async function storagePreflight(needMB) {
  // ask the browser to keep our cache (prevents auto-eviction) and check free space
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      const freeMB = Math.max(0, Math.round(((est.quota || 0) - (est.usage || 0)) / 1048576));
      if (est.quota && freeMB < needMB) return { ok: false, freeMB, needMB };
    } catch (e) {}
  }
  return { ok: true };
}
// in-app dialog (confirm()/alert() are unreliable in installed PWAs)
function appDialog(html, buttons) {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
    const box = document.createElement("div");
    box.style.cssText = "background:var(--card,#122623);color:var(--text,#f2ecdb);border-radius:14px;max-width:420px;padding:20px;font-size:14px;line-height:1.6;box-shadow:0 8px 30px rgba(0,0,0,.5)";
    box.innerHTML = `<div>${html}</div>`;
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:10px;margin-top:16px;flex-wrap:wrap";
    buttons.forEach(([label, val, primary]) => {
      const b = document.createElement("button");
      b.className = "btn" + (primary ? "" : " ghost");
      b.textContent = label;
      b.onclick = () => { ov.remove(); resolve(val); };
      row.appendChild(b);
    });
    box.appendChild(row);
    ov.appendChild(box);
    ov.addEventListener("click", e => { if (e.target === ov) { ov.remove(); resolve(null); } });
    document.body.appendChild(ov);
  });
}
async function saveWholeQuranOffline(btn) {
  const status = document.getElementById("dlAllStatus");
  const set = t => { const el = document.getElementById("dlAllStatus"); if (el) el.textContent = t; };
  if (quranDl.running) { quranDl.cancel = true; btn.textContent = "Cancelling…"; return; }
  if (!("caches" in window)) { set("This browser can't save offline audio — try Chrome"); return; }
  const reciterName = curRecInfo().name;
  const remaining = 114 - savedSurahCount();
  if (remaining > 0) {
    const needMB = Math.max(1, Math.round(remaining * 7));
    const pre = await storagePreflight(needMB);
    if (!pre.ok) {
      await appDialog(`Not enough free storage in your browser.<br>Offline Quran needs about <b>${needMB} MB</b> free, but only <b>${pre.freeMB} MB</b> is available.<br><br>Tip: save individual surahs instead (open a surah → Save offline), or free up phone storage.`, [["OK", false, true]]);
      return;
    }
    const go = await appDialog(
      `Download the whole Quran (<b>${reciterName}</b>) for offline use?<br><br>About <b>${needMB} MB</b> of audio will be downloaded once — keep the app open until it finishes. Already-saved surahs are skipped. You can cancel anytime.`,
      [["Download", true, true], ["Cancel", false, false]]);
    if (!go) return;
  }
  quranDl = { running: true, cancel: false };
  btn.textContent = "■ Cancel download";
  const cache = await caches.open(AUDIO_CACHE);
  let done = 0, failed = 0;
  try {
    for (const s of surahsCache) {
      if (quranDl.cancel) break;
      const key = offlineKey(s.number);
      const off = offlineMap();
      if (off[key]) { done++; continue; }
      const urls = surahAudioUrls(s.number, s.ayah_count);
      let ok = true;
      for (const u of urls) {
        if (quranDl.cancel) break;
        if (!(await cache.match(u))) {
          try {
            const r = await fetch(u);
            if (r.ok || r.type === "opaque") await cache.put(u, r);
            else { ok = false; set(`Problem: server returned ${r.status} for this surah`); }
          } catch (e) { ok = false; set(`Problem: ${esc(String(e.message || e).slice(0, 120))}`); }
        }
      }
      if (quranDl.cancel) break;
      if (ok) {
        const off = offlineMap();
        off[key] = true;
        localStorage.setItem("ilm_offline", JSON.stringify(off));
      } else failed++;
      done++;
      set(`${done}/114 surahs saved${failed ? " · " + failed + " failed (will retry next run)" : ""} — tap surahs meanwhile, download continues`);
    }
  } finally {
    const cancelled = quranDl.cancel;
    quranDl = { running: false, cancel: false };
    btn.textContent = "⬇ Save whole Quran offline";
    set(cancelled
      ? `Paused at ${savedSurahCount()}/114 — tap again to resume`
      : savedSurahCount() === 114
        ? "✓ Whole Quran saved offline — works without internet"
        : `${savedSurahCount()}/114 saved — tap again to retry the failed ones`);
  }
}

// ---- Hadith audio: Arabic text-to-speech via the Ilm API, chunk by chunk.
// Every chunk that plays is stored in Cache Storage, so a hadith you have
// listened to once is available offline forever after. ----
const HADITH_CACHE = "ilm-hadith-audio";
let hAudio = null, hPlayState = null;
const hadithAudioURL = (slug, num, i) => new URL("__hadith_audio__/" + encodeURIComponent(slug || "h") + "/" + num + "/" + i, location.href).href;
function splitArabic(text, max = 180) {
  const words = String(text).replace(/\uFEFF/g, "").replace(/\s+/g, " ").trim().split(" ");
  const out = []; let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length > max) { if (cur) out.push(cur); cur = w; }
    else cur = cur ? cur + " " + w : w;
  }
  if (cur) out.push(cur);
  return out.length ? out : [String(text).trim()].filter(Boolean);
}
function stopHadithAudio() {
  if (hAudio) { hAudio.pause(); hAudio = null; }
  if (hPlayState) {
    hPlayState.blobs.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
    const b = hPlayState.btn;
    if (b) { b.textContent = "▶ Listen"; b.classList.remove("loading"); }
    if (hPlayState.card) hPlayState.card.classList.remove("playing");
    hPlayState = null;
  }
}
async function playHadithAudio(btn, slug, num, text) {
  if (hPlayState && hPlayState.btn === btn) { stopHadithAudio(); return; }
  stopHadithAudio();
  const card = btn.closest(".hcard");
  if (!("caches" in window)) { await appDialog("This browser can't save offline audio — try Chrome.", [["OK", null, true]]); return; }
  const cache = await caches.open(HADITH_CACHE);
  const fullURL = hadithAudioURL(slug, num, "full");
  const pieces = splitArabic(text);
  btn.classList.add("loading");
  let mode = null;      // "recorded" (a human recitation) or "tts" (Arabic voice)
  const blobs = [];
  try {
    // 1) anything already saved plays instantly, offline
    const full = await cache.match(fullURL);
    if (full) { blobs.push(await full.blob()); mode = "recorded"; }
    if (!blobs.length) {
      const first = await cache.match(hadithAudioURL(slug, num, 0));
      if (first) {
        mode = "tts";
        for (let i = 0; i < pieces.length; i++) {
          const c = await cache.match(hadithAudioURL(slug, num, i));
          if (c) blobs.push(await c.blob());
        }
      }
    }
    // 2) online: a recorded recitation where one exists, the TTS voice otherwise
    if (!blobs.length) {
      if (!navigator.onLine) throw new Error("offline");
      let resolved = null;
      try { resolved = await (await fetch(API + "/v1/hadith-audio/" + encodeURIComponent(slug) + "/" + encodeURIComponent(num))).json(); } catch (e) {}
      if (!hForceTts && resolved && resolved.recorded && resolved.clip) {
        btn.textContent = "… recitation";
        const r = await fetch(API + resolved.clip);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const blob = await r.blob();
        if (blob.size < 2000) throw new Error("empty clip");
        await cache.put(fullURL, new Response(blob, { headers: { "Content-Type": blob.type || "audio/mpeg" } }));
        blobs.push(blob); mode = "recorded";
      } else {
        mode = "tts";
        for (let i = 0; i < pieces.length; i++) {
          const url = hadithAudioURL(slug, num, i);
          let hit = await cache.match(url);
          if (!hit) {
            btn.textContent = "\u2026 " + (i + 1) + "/" + pieces.length;
            const res = await fetch(API + "/v1/dictionary/audio?word=" + encodeURIComponent(pieces[i]));
            if (!res.ok) throw new Error("HTTP " + res.status);
            const blob = await res.blob();
            if (blob.size < 200) throw new Error("empty clip");
            await cache.put(url, new Response(blob, { headers: { "Content-Type": "audio/mpeg" } }));
            hit = await cache.match(url);
          }
          blobs.push(await hit.blob());
        }
      }
    }
  } catch (e) {
    btn.classList.remove("loading"); btn.textContent = "\u25b6 Listen";
    await appDialog(navigator.onLine
      ? "Hadith audio unavailable right now — the recitation service is busy, try again shortly."
      : "This hadith is not saved for offline yet. Connect once, tap Listen, and it saves itself for offline use.",
      [["OK", null, true]]);
    return;
  }
  hForceTts = false;
  btn.classList.remove("loading"); btn.textContent = mode === "recorded" ? "\u23f9 Recitation" : "\u23f9 Voice";
  btn.title = mode === "recorded" ? "Recorded recitation \u00b7 saved offline" : "Arabic voice \u00b7 saved offline";
  if (card) card.classList.add("playing");
  hPlayState = { slug, num, btn, card, mode, text, blobs: blobs.map(b => URL.createObjectURL(b)), i: 0 };
  playHChunk();
}
let hForceTts = false;
function playHChunk() {
  const st = hPlayState; if (!st) return;
  if (st.i >= st.blobs.length) return stopHadithAudio();
  hAudio = new Audio(st.blobs[st.i]);
  st.i++;
  hAudio.onended = playHChunk;
  hAudio.onerror = async () => {
    // a recording this device can't decode (e.g. ogg on iPhone): drop it and
    // read the hadith with the TTS voice instead
    const st2 = hPlayState;
    if (st2 && st2.mode === "recorded") {
      const cache = await caches.open(HADITH_CACHE);
      await cache.delete(hadithAudioURL(st2.slug, st2.num, "full"));
      stopHadithAudio();
      hForceTts = true;
      playHadithAudio(st2.btn, st2.slug, st2.num, st2.text);
    } else stopHadithAudio();
  };
  hAudio.play().catch(() => { if (hAudio && hAudio.onerror) try { hAudio.onerror(); } catch (e) {} });
}
function wireHadithPlay(scope) {
  (scope || document).querySelectorAll(".hplay").forEach(b => {
    if (b.dataset.wired) return; b.dataset.wired = "1";
    b.addEventListener("click", async e => {
      e.stopPropagation();
      const card = b.closest(".hcard") || b.closest(".ayah");
      const arEl = card && (card.querySelector(".hc-ar") || card.querySelector(".ar"));
      const text = arEl ? arEl.textContent : "";
      if (!text || !text.trim()) { await appDialog("This hadith has no Arabic text to read.", [["OK", null, true]]); return; }
      playHadithAudio(b, b.dataset.slug, b.dataset.num, text);
    });
  });
}

const OFFLINE_HADITH_S = { bukhari: 1, muslim: 1, nasai: 1, abudawud: 1, tirmidhi: 1, ibnmajah: 1 };
async function offlineHadithLines(slug) {
  const c = await caches.open(HADITH_CACHE);
  const r = await c.match(`./hadith/${slug}.ndjson`);
  if (!r) throw new Error("offline-not-saved");
  return (await r.text()).split("\n").filter(Boolean).map(l => JSON.parse(l));
}
async function offlineHadithBook(slug, page) {
  const m = hbMeta(slug);
  const recs = await offlineHadithLines(slug);
  const per = 20;
  const total = recs.length;
  const total_pages = Math.max(1, Math.ceil(total / per));
  page = Math.min(Math.max(1, page), total_pages);
  const hadiths = recs.slice((page - 1) * per, page * per).map(r => ({
    hadith_number: r.n, book_number: r.b, grade: r.g, narrator: r.w, text_arabic: r.ar, text_english: r.en
  }));
  return { collection: { name: m.name || slug, name_arabic: m.ar }, page, total, total_pages,
    has_next: page < total_pages, has_prev: page > 1,
    next_page: page < total_pages ? page + 1 : null, prev_page: page > 1 ? page - 1 : null, hadiths };
}

async function renderHadithNumber(view, slug, number) {

const RECITERS = {

let qAudio = null;
const curReciter = () => localStorage.getItem("ilm_reciter") || "alafasy";
const curRecInfo = () => RECITERS[curReciter()] || RECITERS.alafasy;
const pad3 = v => String(v).padStart(3, "0");
function ayahURL(surah, ayah) {

}
function surahAudioURL(surah) {

}
function surahAudioUrls(surah, totalAyahs) {

    ? [surahAudioURL(surah)]

// ---- Offline: save a surah's audio to Cache Storage (works without network after) ----
const AUDIO_CACHE = "ilm-quran-audio";
const offlineKey = surah => `${curReciter()}_${surah}`;
const offlineMap = () => JSON.parse(localStorage.getItem("ilm_offline") || "{}");
const isSavedOffline = surah => !!offlineMap()[offlineKey(surah)];
function applyReciterUI(surah) {
  const full = !!curRecInfo().fullSurah;
  document.querySelectorAll(".aplay").forEach(b => b.style.display = full ? "none" : "flex");
  const note = document.getElementById("rnote");
  if (note) note.textContent = full
    ? "Islam Sobhi recites the full surah as one audio file — ayah-by-ayah play is available with the other reciters."
    : "";
  const mc = document.getElementById("memCard"); if (mc) mc.style.display = full ? "none" : "";
  const dl = document.getElementById("dlSurah");
  if (dl) {
    const saved = isSavedOffline(surah);
    dl.textContent = saved ? "✓ Saved offline" : "⬇ Save offline";
    dl.disabled = false;
    dl.classList.toggle("saved", saved);
  }
}
async function saveSurahOffline(surah, totalAyahs, btn) {
  if (!("caches" in window)) { btn.textContent = "Offline unsupported here"; return; }
  if (!navigator.onLine && !isSavedOffline(surah)) { btn.textContent = "You're offline — connect once"; return; }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  const urls = surahAudioUrls(surah, totalAyahs);
  btn.disabled = true;
  let done = 0;
  try {
    const cache = await caches.open(AUDIO_CACHE);
    const queue = urls.slice();
    const worker = async () => {
      while (queue.length) {
        const u = queue.shift();
        if (!(await cache.match(u))) {
          const r = await fetch(u);
          if (r.ok) await cache.put(u, r);
        }
        done++;
        btn.textContent = `⬇ Saving ${done}/${urls.length}…`;
      }
    };
    await Promise.all(Array.from({ length: Math.min(8, urls.length) }, worker));
    const off = offlineMap();
    off[offlineKey(surah)] = true;
    localStorage.setItem("ilm_offline", JSON.stringify(off));
    btn.textContent = "✓ Saved offline";
    btn.classList.add("saved");
  } catch (e) {
    btn.textContent = `Failed: ${String(e.message || e).slice(0, 60)} — retry`;
  }
  btn.disabled = false;
}

// ---- Background / lock-screen playback (Media Session) ----
function setMediaSession(surahName) {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "Surah " + surahName,
      artist: curRecInfo().name,
      album: "Ilm Daily — Quran",
      artwork: [{ src: new URL("icon-512.png", location.href).href, sizes: "512x512", type: "image/png" }]
    });
    navigator.mediaSession.setActionHandler("play", () => qAudio && qAudio.play());
    navigator.mediaSession.setActionHandler("pause", () => qAudio && qAudio.pause());
    navigator.mediaSession.setActionHandler("stop", () => stopQuranAudio());
  } catch (e) {}
}
function wireMediaSession() {
  if (!qAudio || !("mediaSession" in navigator)) return;
  qAudio.addEventListener("play", () => { try { navigator.mediaSession.playbackState = "playing"; } catch (e) {} });
  qAudio.addEventListener("pause", () => { try { navigator.mediaSession.playbackState = "paused"; } catch (e) {} });
  qAudio.addEventListener("loadedmetadata", () => {
    try { navigator.mediaSession.setPositionState({ duration: qAudio.duration, playbackRate: qAudio.playbackRate, position: qAudio.currentTime }); } catch (e) {}
  });
}

function stopQuranAudio() {
  memState = null; // stopping anything also ends a memorize session
  if (qAudio) { qAudio.pause(); delete qAudio; qAudio = null; }
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
  const b = document.getElementById("playSurah"); if (b) b.textContent = "▶ Play surah";
  const ms = document.getElementById("memStart"); if (ms) { ms.disabled = false; ms.textContent = "▶ Start"; }
  const st = document.getElementById("memStatus"); if (st) st.textContent = "";
  if ("mediaSession" in navigator) { try { navigator.mediaSession.playbackState = "none"; } catch (e) {} }
}
function playQuranFrom(surah, startAyah, totalAyahs, surahName) {
  stopQuranAudio();
  const full = !!curRecInfo().fullSurah;
  const play = (aNo) => {
    if (aNo > totalAyahs || !document.getElementById("playSurah")) { stopQuranAudio(); return; }
    qAudio = new Audio(full ? surahAudioURL(surah) : ayahURL(surah, aNo));
    qAudio.dataset.a = full ? "full" : aNo;
    document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
    if (!full) {
      const row = document.querySelector(`.ayah[data-a="${aNo}"]`);
      if (row) { row.classList.add("playing"); row.scrollIntoView({ block: "center", behavior: "smooth" }); }
    }
    document.getElementById("playSurah").textContent = full ? "⏹ Stop surah" : `⏹ Stop (${aNo}/${totalAyahs})`;
    setMediaSession(surahName);
    wireMediaSession();
    qAudio.addEventListener("ended", () => full ? stopQuranAudio() : play(aNo + 1));
    qAudio.addEventListener("error", () => stopQuranAudio());
    qAudio.play().catch(() => stopQuranAudio());
  };
  play(full ? 1 : startAyah);
}

// ---- Memorize mode: ayah-by-ayah with per-ayah repetition, range loops,
// recitation speed control, live highlight and auto-scroll. Great for
// hifz: the audio you have saved offline is used automatically. ----
let memState = null;
function startMemorize(surah, total, surahName, o) {
  stopQuranAudio();
  memState = { surah, total, surahName, from: o.from, to: o.to, perAyah: o.perAyah,
    loops: o.loops, loopForever: o.loopForever, speed: o.speed, ayah: o.from, rep: 1, loop: 1 };
  memStep();
}
function memStep() {
  const m = memState;
  if (!m) return;
  if (m.ayah > m.to) {
    if (m.loopForever || m.loop < m.loops) { m.loop++; m.ayah = m.from; m.rep = 1; }
    else { stopQuranAudio(); return; }
  }
  qAudio = new Audio(ayahURL(m.surah, m.ayah));
  qAudio.dataset.a = m.ayah;
  qAudio.playbackRate = m.speed;
  document.querySelectorAll(".ayah.playing").forEach(el => el.classList.remove("playing"));
  const row = document.querySelector(`.ayah[data-a="${m.ayah}"]`);
  if (row) { row.classList.add("playing"); row.scrollIntoView({ block: "center", behavior: "smooth" }); }
  const ms = document.getElementById("memStart"); if (ms) ms.textContent = "■ Stop";
  const st = document.getElementById("memStatus");
  if (st) st.textContent = `Ayah ${m.ayah} · repeat ${m.rep}/${m.perAyah} · round ${m.loop}${m.loopForever ? "" : "/" + m.loops} · ${m.speed}\u00d7`;
  setMediaSession(m.surahName + " (memorize)");
  wireMediaSession();
  qAudio.addEventListener("ended", () => {
    const cur = memState;
    if (!cur) return;
    if (cur.rep < cur.perAyah) cur.rep++;
    else { cur.rep = 1; cur.ayah++; }
    setTimeout(() => { if (memState) memStep(); }, 450);
  });
  qAudio.addEventListener("error", () => stopQuranAudio());
  qAudio.play().catch(() => stopQuranAudio());
}

// ---- Phone alarm (Web Push — rings at every salah even when the app is closed) ----
const PRAYER_KEYS = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
function urlB64ToUint8Array(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function apiPost(path, body) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}
async function enablePhoneAlarm() {
  const st = document.getElementById("pushStatus");
  const set = t => { const el = document.getElementById("pushStatus"); if (el && st) el.textContent = t; };
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error("This browser can't do phone alarms");
    if (typeof Notification !== "undefined" && Notification.permission !== "granted") {
      const p = await Notification.requestPermission();
      if (p !== "granted") throw new Error("Notifications blocked");
    }
    const reg = await navigator.serviceWorker.ready;
    const { publicKey } = await (await fetch(API + "/v1/alarm/vapid")).json();
    if (!publicKey) throw new Error("Push server not ready");
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(publicKey) });
    }
    const s = sub.toJSON();
    await apiPost("/v1/alarm/subscribe", {
      endpoint: s.endpoint, p256dh: s.keys.p256dh, auth: s.keys.auth,
      lat: loc.lat, lng: loc.lng,
      timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC",
      prayers: alarmCfg.prayers
    });
    localStorage.setItem("ilm_push_sub", sub.endpoint);
    set("✓ ringing on this phone at every salah");
  } catch (e) {
    alarmCfg.push = false; saveAlarm();
    set(e.message === "Notifications blocked" ? "Notifications blocked — allow them in browser settings" : "Phone alarm unavailable: " + e.message);
    renderAlarmCard();
  }
}
async function disablePhoneAlarm() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await apiPost("/v1/alarm/unsubscribe", { endpoint: sub.endpoint }); sub.unsubscribe(); }
    localStorage.removeItem("ilm_push_sub");
  } catch (e) {}
}
// keep location/prayer selection fresh whenever the app opens
(async function syncPhoneAlarm() {
  try {
    if (!alarmCfg.push) return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) { await enablePhoneAlarm(); return; }
    const s = sub.toJSON();
    await apiPost("/v1/alarm/subscribe", {
      endpoint: s.endpoint, p256dh: s.keys.p256dh, auth: s.keys.auth,
      lat: loc.lat, lng: loc.lng,
      timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC",
      prayers: alarmCfg.prayers
    });
  } catch (e) {}
})();

function scheduleSalatAlarms(times) {
  alarmTimers.forEach(t => clearTimeout(t));
  alarmTimers = [];
  if (!alarmCfg.on) return;
  const now = new Date();
  let scheduled = 0;
  for (const k of ["fajr", "dhuhr", "asr", "maghrib", "isha"]) {
    if (!alarmCfg.prayers[k]) continue;
    const t = new Date(times[k]);
    const ms = t - now;
    if (ms > 0 && ms < 36 * 3600 * 1000) {
      alarmTimers.push(setTimeout(() => ringAlarm(k), ms));
      scheduled++;
    }
  }
  // after Isha, wake just after midnight to reschedule for tomorrow's Fajr
  const midnight = new Date(); midnight.setHours(24, 0, 10, 0);
  const mms = midnight - now;
  if (mms > 0) alarmTimers.push(setTimeout(() => { if (alarmCfg.on) render("prayer"); }, mms));
  // keep the schedule warm if the tab was asleep (missed timers)
  clearInterval(window.__alarmChk);
  window.__alarmChk = setInterval(() => {
    if (!alarmCfg.on) return;
    for (const k of ["fajr", "dhuhr", "asr", "maghrib", "isha"]) {
      if (!alarmCfg.prayers[k]) continue;
      const t = new Date(times[k]);
      const since = now2() - t;
      if (since > 0 && since < 45000 && !window.__rang?.[k + t.getDate()]) {
        (window.__rang = window.__rang || {})[k + t.getDate()] = 1;
        ringAlarm(k);
      }
    }
  }, 30000);
  function now2() { return new Date(); }
}

let chimeCtx = null;
function playChime() {
  try {
    chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = chimeCtx;
    if (ctx.state === "suspended") ctx.resume();
    for (let rep = 0; rep < 3; rep++) {
      [880, 1174.7].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t0 = ctx.currentTime + rep * 1.1 + i * 0.02;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
        o.connect(g).connect(ctx.destination);
        o.start(t0); o.stop(t0 + 1.05);
      });
    }
    return true;
  } catch (e) { return false; }
}

function playAlarmSound() {
  if (alarmCfg.sound === "chime") { playChime(); return; }
  try {
    adhanAudio = adhanAudio || new Audio(ADHAN_URL);
    adhanAudio.volume = 1;
    adhanAudio.currentTime = 0;
    adhanAudio.play().catch(() => playChime());
  } catch (e) { playChime(); }
}

function ringAlarm(key) {
  if (key !== "test" && !alarmCfg.on) return;
  const label = key === "test" ? "Test alarm" : `It is time for ${PRAYER_NAMES[key]}`;
  playAlarmSound();
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 600]); } catch (e) {}
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification("Ilm Daily — " + label, { body: key === "test" ? "This is how the salat alarm sounds." : `${PRAYER_NAMES[key]} has begun in your area. حي على الصلاة`, icon: "/icon-192.png" }); } catch (e) {}
  }
  const banner = document.createElement("div");
  banner.id = "alarmBanner";
  banner.style.cssText = "position:fixed;inset:auto 0 0 0;z-index:999;background:#C9A24B;color:#0f2121;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;box-shadow:0 -4px 20px rgba(0,0,0,.4)";
  banner.innerHTML = `<span>🔔 ${esc(label)}${key === "test" ? "" : ` — <span dir="rtl">حي على الصلاة</span>`}</span><button style="background:#0f2121;color:#C9A24B;border:none;border-radius:8px;padding:6px 14px;cursor:pointer">Dismiss</button>`;
  banner.querySelector("button").addEventListener("click", () => banner.remove());
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 60000);
  if (key !== "test") setTimeout(() => render("prayer"), 4000);
}

// boot: render after every module & config is declared
render("prayer");
</script>
</body>
</html>
